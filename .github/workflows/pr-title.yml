name: PR title

# Pull requests are squash-merged and the title becomes the commit message, so
# the title is what Release Please reads to choose the next version.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|refactor|chore|ci|test|build|style)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            {
              echo "The title \"$TITLE\" is not a Conventional Commits title."
              echo "Start it with a type, for example \"feat: ...\", \"fix(tui): ...\" or \"docs: ...\"."
              echo "Types: feat, fix, perf, revert, docs, refactor, chore, ci, test, build, style."
            } >&2
            exit 1
          fi
