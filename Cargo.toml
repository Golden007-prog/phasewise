[package]
name = "phasewise"
version = "0.1.0"
edition = "2024"
description = "Run big plans with Claude Code or Codex one phase at a time — verified, checkpointed, and reviewable."
license = "MIT"
repository = "https://github.com/userfypp/phasewise"
readme = "README.md"
keywords = ["claude", "codex", "agent", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
jiff = { version = "0.2.43", features = ["serde"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
